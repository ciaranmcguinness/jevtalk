<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JevTalk!</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script>
        var socket = io();

        // Listen for messages from server
        socket.on("message", function(data) {
            var messages = document.getElementById("messages");
            console.log(data)
            messages.lastElementChild.innerHTML += `${data}`;
        });
        socket.on("done", function (data){
            var bttn = document.getElementById("sendbutton");
            bttn.disabled = false;
            bttn.innerText = "Send";
        })

        // Function to send messages
        function sendMessage() {
            var bttn = document.getElementById("sendbutton");
            bttn.disabled = true;
            bttn.innerText = "Responding...";
            var messages = document.getElementById("messages");
            var msgInput = document.getElementById("msg");
            var message = msgInput.value;
            socket.send(message);
            msgInput.value = "";
            var said = document.createElement("div");
            said.innerHTML = `You said: ${message}`
            messages.appendChild(said);
            resp = document.createElement("div")
            resp.innerHTML = "Jev said:"
            messages.appendChild(resp);
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap');
        :root{
            --border-width: 2px;
            --border-color: #555555;
        }
        *{
            font-family: "Outfit", sans-serif;
            font-optical-sizing: auto;
            background-color: #2c2c2c;
            color: white;
        }
        *:focus {
            outline: none;
        }

        body{
            display: flex;
            flex-direction: column;
            align-items: stretch;
            margin: 0;
            height: 100vh;
        }
        h1{
            text-align: center;
            font-size: 36pt;
        }
        #messages{
            flex-grow: 1;
            margin: 5px 20px;
        }
        input{
            border-width: var(--border-width);
            border-color: var(--border-color);
            border-right-style: solid;
            flex-grow: 1;
        }
        button{
            border-right-style: none;
        }
        .control{
            font-size: 24pt;
            border-top-style: none;
            border-bottom-style: none;
            border-left-style: none;
        }
        #controls{
            border: var(--border-width) solid var(--border-color);
            display: flex;
            margin: 10px;
        }
    </style>
</head>
<body>
    <h1>JevTalk</h1>
    <div id="messages"></div>
    <div id="controls"><input class="control" id="msg" type="text" placeholder="Enter your message"><button class="control" onclick="sendMessage()" id="sendbutton">Send</button></div>
</body>
</html>
