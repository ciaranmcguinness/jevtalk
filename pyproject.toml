[project]
name = "jevtalk"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "flask-socketio>=5.7.0",
    "openai-agents[any-llm]>=0.23.1",
    "python-dotenv>=1.2.4",
    "typesafe-sdk>=0.7.2",
]

[project.scripts]
jevtalk = "jevtalk:main"

[tool.vercel]
entrypoint = "jevtalk:app"


[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
